<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-Op Kingdom Tower Defense</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080a0f;
      color: #f0f0f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 15px;
      font-size: 2.2rem;
      background: linear-gradient(45deg, #40c4ff, #76ff03);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(64, 196, 255, 0.3);
    }
    #lobby {
      background: #121622;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid #1f2638;
      margin-bottom: 25px;
    }
    .step { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #a0aab0; font-size: 0.9rem; }
    textarea {
      width: 100%;
      height: 65px;
      background: #080a0f;
      border: 1px solid #2a344d;
      color: #76ff03;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      border-radius: 6px;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #40c4ff; }
    .btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #40c4ff, #0088ff);
      color: #080a0f;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(64, 196, 255, 0.3);
      transition: all 0.2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(64, 196, 255, 0.5); }
    button:disabled { background: #222a38; color: #555; box-shadow: none; cursor: not-allowed; }
    .sub-btn { flex: none; padding: 6px 14px; margin-top: 6px; background: #1c2333; color: #fff; font-size: 0.85rem; box-shadow: none; }
    .sub-btn:hover { background: #28334a; }
    #gameContainer {
      display: none;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    canvas {
      border: 3px solid #1f2638;
      border-radius: 10px;
      background: #0d121d;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      cursor: crosshair;
    }
    #buildBar {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      background: #121622;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #1f2638;
    }
    .build-btn {
      padding: 8px 16px;
      background: #1c2333;
      color: #fff;
      border: 1px solid #2a344d;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .build-btn.active { border-color: #76ff03; background: #283818; color: #76ff03; }
    #storyOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 900px; height: 600px;
      background: rgba(8, 10, 15, 0.95);
      backdrop-filter: blur(6px);
      border-radius: 10px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      text-align: center;
      z-index: 10;
      border: 2px solid #76ff03;
    }
    #storyTitle { color: #76ff03; font-size: 1.6rem; margin-bottom: 15px; font-weight: bold; }
    #storyText { color: #d0d8e0; font-size: 1.05rem; line-height: 1.6; margin-bottom: 25px; max-width: 700px; }
    .story-btn-group { display: flex; gap: 15px; width: 100%; max-width: 650px; }
    .story-btn {
      flex: 1; padding: 12px; background: #161c28; border: 1px solid #76ff03; color: white;
      border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s;
    }
    .story-btn:hover { background: #76ff03; color: #080a0f; }
    #status { margin-top: 12px; font-weight: 600; color: #ffcc00; font-size: 0.95rem; text-align: center; }
  </style>
</head>
<body>

  <h1>🏰 KINGDOM CO-OP DEFENSE</h1>

  <div id="lobby">
    <div class="btn-group">
      <button id="btnHost" onclick="startHost()">1. Host Kingdom</button>
      <button id="btnJoin" onclick="startJoin()">1. Join Kingdom</button>
    </div>

    <div class="step">
      <label>Step 2: Copy your connection code and send it to your partner:</label>
      <textarea id="localSDP" readonly placeholder="Click Host or Join above..."></textarea>
      <button class="sub-btn" onclick="copySDP()">Copy Code</button>
    </div>

    <div class="step">
      <label>Step 3: Paste your partner's code here and click Connect:</label>
      <textarea id="remoteSDP" placeholder="Paste partner code here..."></textarea>
      <button id="btnAccept" class="sub-btn" onclick="acceptRemoteSDP()">Connect Code</button>
    </div>

    <div id="status">Status: Ready. Choose Host or Join.</div>
  </div>

  <div id="gameContainer">
    <canvas id="canvas" width="900" height="600"></canvas>
    
    <div id="buildBar">
      <button class="build-btn active" onclick="setBuildMode('none')">Mode: Combat / Mine</button>
      <button class="build-btn" onclick="setBuildMode('wall')">Wall (10 Wood, 5 Stone)</button>
      <button class="build-btn" onclick="setBuildMode('archer')">Archer Tower (20 Wood, 10 Stone)</button>
      <button class="build-btn" onclick="setBuildMode('cannon')">Cannon Tower (30 Wood, 25 Stone)</button>
    </div>

    <!-- Collaborative Story & Upgrade Overlay -->
    <div id="storyOverlay">
      <div id="storyTitle">📜 KINGDOM COUNCIL EVENT</div>
      <div id="storyText">A decision must be made...</div>
      <div class="story-btn-group">
        <button class="story-btn" id="choiceA" onclick="makeChoice(0)">Option A</button>
        <button class="story-btn" id="choiceB" onclick="makeChoice(1)">Option B</button>
      </div>
    </div>
  </div>

<script>
  // --- WebRTC Signaling ---
  const config = { iceServers: [{ urls: "stun:stun.l.google.com:19020" }] };
  let pc, dataChannel;
  let isHost = false;

  const statusEl = document.getElementById('status');
  const localSDPEl = document.getElementById('localSDP');
  const remoteSDPEl = document.getElementById('remoteSDP');

  function initPeerConnection() {
    if (pc) pc.close();
    pc = new RTCPeerConnection(config);

    pc.onicecandidate = (e) => {
      if (pc.localDescription) {
        localSDPEl.value = JSON.stringify(pc.localDescription);
      }
    };

    pc.onconnectionstatechange = () => {
      statusEl.innerText = `Connection State: ${pc.connectionState}`;
      if (pc.connectionState === 'connected') launchGame();
    };
  }

  async function startHost() {
    isHost = true;
    document.getElementById('btnJoin').disabled = true;
    statusEl.innerText = "Status: Hosting Kingdom... Generating code.";
    initPeerConnection();

    dataChannel = pc.createDataChannel("gameData");
    setupDataChannel();

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    localSDPEl.value = JSON.stringify(pc.localDescription);
  }

  async function startJoin() {
    isHost = false;
    document.getElementById('btnHost').disabled = true;
    statusEl.innerText = "Status: Joining Kingdom... Paste Host code below.";
    initPeerConnection();

    pc.ondatachannel = (e) => {
      dataChannel = e.channel;
      setupDataChannel();
    };
  }

  async function acceptRemoteSDP() {
    const rawSDP = remoteSDPEl.value.trim();
    if (!rawSDP) return alert("Please paste a valid code first!");

    try {
      const desc = new RTCSessionDescription(JSON.parse(rawSDP));
      await pc.setRemoteDescription(desc);

      if (!isHost) {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        localSDPEl.value = JSON.stringify(pc.localDescription);
        statusEl.innerText = "Status: Answer generated! Copy back to Host.";
      }
    } catch (err) {
      alert("Invalid code format!");
    }
  }

  function setupDataChannel() {
    dataChannel.onopen = () => launchGame();
    dataChannel.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (isHost && msg.type === 'input') {
        clientInput = msg.data;
      } else if (isHost && msg.type === 'storyChoice') {
        resolveStoryChoice(msg.choiceIndex);
      } else if (!isHost && msg.type === 'state') {
        gameState = msg.state;
      } else if (!isHost && msg.type === 'triggerStory') {
        showStoryNode(msg.node);
      } else if (!isHost && msg.type === 'closeStory') {
        document.getElementById('storyOverlay').style.display = 'none';
      }
    };
  }

  function copySDP() {
    localSDPEl.select();
    navigator.clipboard.writeText(localSDPEl.value);
    alert("Connection code copied to clipboard!");
  }

  function launchGame() {
    statusEl.innerText = "Status: Connected! Launching Kingdom...";
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('gameContainer').style.display = 'flex';
    initGame();
  }

  // --- Collaborative Kingdom Story Events ---
  const storyChapters = [
    {
      title: "📜 EVENT 1: SURVIVOR CARAVAN",
      text: "A band of displaced villagers approaches your gates seeking shelter from the undead. They offer extra stone, but feeding them will strain kingdom reserves.",
      choices: [
        { text: "Welcome Them In (+40 Stone, +10 Wood)", result: "Grateful builders reinforce your walls with fresh stone!" },
        { text: "Recruit Weaponsmiths (Upgrade Tower Attack Rate +20%)", result: "The blacksmiths sharpen arrow tips and pack cannon charges tighter." }
      ]
    },
    {
      title: "📜 EVENT 2: ANCIENT RUNESTONE",
      text: "Chopping through dense forest reveals an glowing runestone covered in holy runes. How should the royal scholars harness its power?",
      choices: [
        { text: "Channel Holy Light (Heals Town Center & Players to full HP)", result: "A brilliant beacon blazes across the kingdom, clearing all wounds!" },
        { text: "Empower Wall Structures (+100 Extra Health to all Walls)", result: "The defensive masonry petrifies into unbreakable enchanted granite." }
      ]
    }
  ];
  let currentChapterIndex = 0;

  // --- Game Engine & State ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let keys = {};
  let mouse = { x: 450, y: 300, down: false, click: false };
  let clientInput = { keys: {}, angle: 0, clickPos: null, buildMode: 'none' };
  let localBuildMode = 'none';

  let gameState = {
    townCenter: { x: 450, y: 300, hp: 500, maxHp: 500, radius: 30 },
    resources: { wood: 50, stone: 30 },
    players: {
      host:   { x: 400, y: 300, angle: 0, hp: 100, color: '#40c4ff' },
      client: { x: 500, y: 300, angle: 0, hp: 100, color: '#76ff03' }
    },
    buildings: [], // Walls and Towers
    resourcesNodes: [
      { x: 150, y: 150, type: 'tree', hp: 30 }, { x: 200, y: 120, type: 'tree', hp: 30 },
      { x: 750, y: 150, type: 'stone', hp: 40 }, { x: 700, y: 100, type: 'stone', hp: 40 },
      { x: 150, y: 480, type: 'stone', hp: 40 }, { x: 750, y: 480, type: 'tree', hp: 30 }
    ],
    zombies: [],
    bullets: [],
    wave: 1,
    zombiesKilled: 0,
    towerSpeedBoost: 1,
    inStory: false
  };

  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  canvas.addEventListener('mousedown', () => { mouse.down = true; mouse.click = true; });
  canvas.addEventListener('mouseup', () => mouse.down = false);

  function setBuildMode(mode) {
    localBuildMode = mode;
    document.querySelectorAll('.build-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }

  function initGame() {
    requestAnimationFrame(gameLoop);
  }

  function gameLoop() {
    let myPlayer = isHost ? gameState.players.host : gameState.players.client;
    let aimAngle = Math.atan2(mouse.y - myPlayer.y, mouse.x - myPlayer.x);
    let clickPos = mouse.click ? { x: mouse.x, y: mouse.y } : null;

    if (isHost) {
      if (!gameState.inStory) {
        updateHost({ keys: { ...keys }, angle: aimAngle, clickPos, buildMode: localBuildMode });

        // Spawn Zombies in waves
        if (gameState.zombies.length < 3 + gameState.wave * 2) {
          spawnZombie();
        }

        // Trigger story milestone every 10 zombies killed
        if (gameState.zombiesKilled > 0 && gameState.zombiesKilled % 10 === 0 && !gameState.storyTriggered) {
          gameState.inStory = true;
          gameState.storyTriggered = true;
          triggerStoryEvent();
        } else if (gameState.zombiesKilled % 10 !== 0) {
          gameState.storyTriggered = false;
        }
      }

      if (dataChannel?.readyState === 'open') {
        dataChannel.send(JSON.stringify({ type: 'state', state: gameState }));
      }
    } else {
      if (dataChannel?.readyState === 'open' && !gameState.inStory) {
        dataChannel.send(JSON.stringify({
          type: 'input',
          data: { keys: { ...keys }, angle: aimAngle, clickPos, buildMode: localBuildMode }
        }));
      }
    }

    mouse.click = false;
    render();
    requestAnimationFrame(gameLoop);
  }

  function spawnZombie() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = Math.random() * canvas.width; y = -20; }
    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 20; }
    else if (side === 2) { x = -20; y = Math.random() * canvas.height; }
    else { x = canvas.width + 20; y = Math.random() * canvas.height; }

    gameState.zombies.push({ x, y, hp: 40 + gameState.wave * 10, speed: 1.2 + Math.random() * 0.4 });
  }

  function triggerStoryEvent() {
    const chapter = storyChapters[currentChapterIndex % storyChapters.length];
    showStoryNode(chapter);
    if (dataChannel?.readyState === 'open') {
      dataChannel.send(JSON.stringify({ type: 'triggerStory', node: chapter }));
    }
  }

  function showStoryNode(node) {
    document.getElementById('storyTitle').innerText = node.title;
    document.getElementById('storyText').innerText = node.text;
    document.getElementById('choiceA').innerText = node.choices[0].text;
    document.getElementById('choiceB').innerText = node.choices[1].text;
    document.getElementById('storyOverlay').style.display = 'flex';
  }

  function makeChoice(index) {
    document.getElementById('storyOverlay').style.display = 'none';
    if (isHost) {
      resolveStoryChoice(index);
    } else if (dataChannel?.readyState === 'open') {
      dataChannel.send(JSON.stringify({ type: 'storyChoice', choiceIndex: index }));
    }
  }

  function resolveStoryChoice(index) {
    gameState.inStory = false;
    currentChapterIndex++;
    gameState.wave++;

    if (index === 0) {
      gameState.resources.stone += 40;
      gameState.resources.wood += 10;
      gameState.townCenter.hp = gameState.townCenter.maxHp;
    } else {
      gameState.towerSpeedBoost += 0.3;
    }

    if (dataChannel?.readyState === 'open') {
      dataChannel.send(JSON.stringify({ type: 'closeStory' }));
      dataChannel.send(JSON.stringify({ type: 'state', state: gameState }));
    }
  }

  function updateHost(hostInput) {
    // Process Host Player & Actions
    updatePlayerPhysics(gameState.players.host, hostInput.keys, hostInput.angle);
    if (hostInput.clickPos) handlePlayerClick(gameState.players.host, hostInput.clickPos, hostInput.buildMode);

    // Process Client Player & Actions
    updatePlayerPhysics(gameState.players.client, clientInput.keys || {}, clientInput.angle || 0);
    if (clientInput.clickPos) handlePlayerClick(gameState.players.client, clientInput.clickPos, clientInput.buildMode);

    // Update Defense Towers
    const now = Date.now();
    for (let b of gameState.buildings) {
      if (b.type === 'archer' || b.type === 'cannon') {
        const fireRate = (b.type === 'archer' ? 600 : 1200) / gameState.towerSpeedBoost;
        if (!b.lastShot || now - b.lastShot > fireRate) {
          // Find nearest zombie
          let nearestZ = null, minDist = b.type === 'archer' ? 180 : 250;
          for (let z of gameState.zombies) {
            let dist = Math.hypot(z.x - b.x, z.y - b.y);
            if (dist < minDist) { minDist = dist; nearestZ = z; }
          }

          if (nearestZ) {
            b.lastShot = now;
            let angle = Math.atan2(nearestZ.y - b.y, nearestZ.x - b.x);
            gameState.bullets.push({
              x: b.x, y: b.y, angle, speed: b.type === 'archer' ? 9 : 6,
              damage: b.type === 'archer' ? 20 : 50, radius: b.type === 'archer' ? 3 : 6, life: 60
            });
          }
        }
      }
    }

    // Update Bullets
    for (let i = gameState.bullets.length - 1; i >= 0; i--) {
      let b = gameState.bullets[i];
      b.x += Math.cos(b.angle) * b.speed;
      b.y += Math.sin(b.angle) * b.speed;
      b.life--;

      if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || b.life <= 0) {
        gameState.bullets.splice(i, 1);
        continue;
      }

      for (let j = gameState.zombies.length - 1; j >= 0; j--) {
        let z = gameState.zombies[j];
        if (Math.hypot(z.x - b.x, z.y - b.y) < 16) {
          z.hp -= b.damage;
          gameState.bullets.splice(i, 1);
          if (z.hp <= 0) {
            gameState.zombies.splice(j, 1);
            gameState.zombiesKilled++;
            gameState.resources.wood += 2;
          }
          break;
        }
      }
    }

    // Update Zombies AI (Target Buildings or Town Center)
    for (let z of gameState.zombies) {
      let target = gameState.townCenter;
      let minDist = Math.hypot(target.x - z.x, target.y - z.y);

      // Attack nearest wall/building if closer
      for (let b of gameState.buildings) {
        let dist = Math.hypot(b.x - z.x, b.y - z.y);
        if (dist < minDist) { minDist = dist; target = b; }
      }

      let angle = Math.atan2(target.y - z.y, target.x - z.x);
      z.x += Math.cos(angle) * z.speed;
      z.y += Math.sin(angle) * z.speed;

      // Damage structure on contact
      if (Math.hypot(target.x - z.x, target.y - z.y) < (target.radius || 15) + 10) {
        target.hp -= 0.3;
      }
    }

    // Clean up destroyed buildings
    gameState.buildings = gameState.buildings.filter(b => b.hp > 0);
  }

  function handlePlayerClick(player, clickPos, mode) {
    if (mode === 'none') {
      // Chop trees / Mine stone
      for (let r of gameState.resourcesNodes) {
        if (Math.hypot(r.x - clickPos.x, r.y - clickPos.y) < 25) {
          r.hp -= 10;
          if (r.type === 'tree') gameState.resources.wood += 8;
          if (r.type === 'stone') gameState.resources.stone += 6;
          if (r.hp <= 0) {
            r.x = Math.random() * (canvas.width - 100) + 50;
            r.y = Math.random() * (canvas.height - 100) + 50;
            r.hp = 30;
          }
          return;
        }
      }
    } else if (mode === 'wall' && gameState.resources.wood >= 10 && gameState.resources.stone >= 5) {
      gameState.resources.wood -= 10; gameState.resources.stone -= 5;
      gameState.buildings.push({ x: clickPos.x, y: clickPos.y, type: 'wall', hp: 120, maxHp: 120, radius: 14 });
    } else if (mode === 'archer' && gameState.resources.wood >= 20 && gameState.resources.stone >= 10) {
      gameState.resources.wood -= 20; gameState.resources.stone -= 10;
      gameState.buildings.push({ x: clickPos.x, y: clickPos.y, type: 'archer', hp: 80, maxHp: 80, radius: 16 });
    } else if (mode === 'cannon' && gameState.resources.wood >= 30 && gameState.resources.stone >= 25) {
      gameState.resources.wood -= 30; gameState.resources.stone -= 25;
      gameState.buildings.push({ x: clickPos.x, y: clickPos.y, type: 'cannon', hp: 100, maxHp: 100, radius: 18 });
    }
  }

  function updatePlayerPhysics(p, pKeys, angle) {
    p.angle = angle;
    const speed = 3.2;
    let vx = 0, vy = 0;

    if (pKeys['KeyW'] || pKeys['ArrowUp']) vy -= speed;
    if (pKeys['KeyS'] || pKeys['ArrowDown']) vy += speed;
    if (pKeys['KeyA'] || pKeys['ArrowLeft']) vx -= speed;
    if (pKeys['KeyD'] || pKeys['ArrowRight']) vx += speed;

    p.x += vx; p.y += vy;
    p.x = Math.max(20, Math.min(canvas.width - 20, p.x));
    p.y = Math.max(20, Math.min(canvas.height - 20, p.y));
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grass grid background
    ctx.strokeStyle = '#121824';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Draw Town Center (Kingdom Heart)
    const tc = gameState.townCenter;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(tc.x, tc.y, tc.radius, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke();

    // Draw Resources (Trees & Stone)
    for (let r of gameState.resourcesNodes) {
      ctx.fillStyle = r.type === 'tree' ? '#2e7d32' : '#78909c';
      ctx.beginPath(); ctx.arc(r.x, r.y, 14, 0, Math.PI * 2); ctx.fill();
    }

    // Draw Buildings (Walls & Towers)
    for (let b of gameState.buildings) {
      ctx.fillStyle = b.type === 'wall' ? '#546e7a' : (b.type === 'archer' ? '#ff9800' : '#e53935');
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    }

    // Draw Zombies (Undead Horde)
    ctx.fillStyle = '#76ff03';
    for (let z of gameState.zombies) {
      ctx.beginPath(); ctx.arc(z.x, z.y, 10, 0, Math.PI * 2); ctx.fill();
    }

    // Draw Bullets
    ctx.fillStyle = '#ffffff';
    for (let b of gameState.bullets) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
    }

    // Draw Players
    for (let id in gameState.players) {
      let p = gameState.players[id];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, -3, 18, 6);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      ctx.restore();
    }

    // HUD / Resources Display
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px system-ui';
    ctx.fillText(`🪵 Wood: ${gameState.resources.wood}  |  🪨 Stone: ${gameState.resources.stone}`, 20, 30);
    ctx.fillText(`👑 Town Center Health: ${Math.ceil(tc.hp)} / ${tc.maxHp}`, 20, 52);
    ctx.fillText(`⚔️ Wave: ${gameState.wave}  |  Zombies Cleared: ${gameState.zombiesKilled}`, canvas.width - 280, 30);
  }
</script>
</body>
</html>
