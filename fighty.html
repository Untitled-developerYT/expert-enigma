<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top-Down WebRTC Arena Shooter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08080c;
      color: #f0f0f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 25px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 2.2rem;
      background: linear-gradient(45deg, #00ffcc, #0088ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
      letter-spacing: 1px;
    }
    #lobby {
      background: #12121c;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid #1f1f2e;
      margin-bottom: 25px;
    }
    .step { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #a0a0b0; font-size: 0.9rem; }
    textarea {
      width: 100%;
      height: 65px;
      background: #08080c;
      border: 1px solid #2a2a3d;
      color: #00ffcc;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      border-radius: 6px;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #00ffcc; }
    .btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #00ffcc, #0099ff);
      color: #08080c;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
      transition: all 0.2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 255, 204, 0.5); }
    button:disabled { background: #222233; color: #555; box-shadow: none; cursor: not-allowed; }
    .sub-btn { flex: none; padding: 6px 14px; margin-top: 6px; background: #1c1c2b; color: #fff; font-size: 0.85rem; box-shadow: none; }
    .sub-btn:hover { background: #28283d; }
    #gameContainer {
      display: none;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border: 3px solid #1f1f2e;
      border-radius: 10px;
      background: #0d0d14;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      cursor: crosshair;
    }
    #status {
      margin-top: 12px;
      font-weight: 600;
      color: #ffcc00;
      font-size: 0.95rem;
      text-align: center;
    }
    .controls-hint {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #888899;
      text-align: center;
      background: #12121c;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #1f1f2e;
    }
    .key { background: #1c1c2b; color: #00ffcc; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🎯 P2P TOP-DOWN ARENA</h1>

  <div id="lobby">
    <div class="btn-group">
      <button id="btnHost" onclick="startHost()">1. Host Game</button>
      <button id="btnJoin" onclick="startJoin()">1. Join Game</button>
    </div>

    <div class="step">
      <label>Step 2: Copy your connection code and send it to your peer:</label>
      <textarea id="localSDP" readonly placeholder="Click Host or Join above..."></textarea>
      <button class="sub-btn" onclick="copySDP()">Copy Code</button>
    </div>

    <div class="step">
      <label>Step 3: Paste your peer's code here and click Connect:</label>
      <textarea id="remoteSDP" placeholder="Paste peer code here..."></textarea>
      <button id="btnAccept" class="sub-btn" onclick="acceptRemoteSDP()">Connect Peer Code</button>
    </div>

    <div id="status">Status: Ready. Choose Host or Join.</div>
  </div>

  <div id="gameContainer">
    <canvas id="canvas" width="800" height="500"></canvas>
    <div class="controls-hint">
      Move: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> &nbsp;|&nbsp; 
      Aim: Mouse &nbsp;|&nbsp; Shoot: Left Click
    </div>
  </div>

<script>
  // --- Bulletproof WebRTC Signaling ---
  const config = { iceServers: [{ urls: "stun:stun.l.google.com:19020" }] };
  let pc, dataChannel;
  let isHost = false;

  const statusEl = document.getElementById('status');
  const localSDPEl = document.getElementById('localSDP');
  const remoteSDPEl = document.getElementById('remoteSDP');

  function initPeerConnection() {
    if (pc) pc.close();
    pc = new RTCPeerConnection(config);

    pc.onicecandidate = (e) => {
      if (pc.localDescription) {
        localSDPEl.value = JSON.stringify(pc.localDescription);
      }
    };

    pc.onconnectionstatechange = () => {
      statusEl.innerText = `Connection State: ${pc.connectionState}`;
      if (pc.connectionState === 'connected') {
        launchGame();
      }
    };
  }

  async function startHost() {
    isHost = true;
    document.getElementById('btnJoin').disabled = true;
    statusEl.innerText = "Status: Hosting... Generating offer code.";
    initPeerConnection();

    dataChannel = pc.createDataChannel("gameData");
    setupDataChannel();

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    localSDPEl.value = JSON.stringify(pc.localDescription);
  }

  async function startJoin() {
    isHost = false;
    document.getElementById('btnHost').disabled = true;
    statusEl.innerText = "Status: Joining... Paste Host code below.";
    initPeerConnection();

    pc.ondatachannel = (e) => {
      dataChannel = e.channel;
      setupDataChannel();
    };
  }

  async function acceptRemoteSDP() {
    const rawSDP = remoteSDPEl.value.trim();
    if (!rawSDP) return alert("Please paste a valid peer code first!");

    try {
      const desc = new RTCSessionDescription(JSON.parse(rawSDP));
      await pc.setRemoteDescription(desc);

      if (!isHost) {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        localSDPEl.value = JSON.stringify(pc.localDescription);
        statusEl.innerText = "Status: Answer generated! Copy your code back to the Host.";
      } else {
        statusEl.innerText = "Status: Processing peer answer... Establishing connection.";
      }
    } catch (err) {
      console.error(err);
      alert("Invalid code format! Make sure you copied the entire block.");
    }
  }

  function setupDataChannel() {
    dataChannel.onopen = () => launchGame();
    dataChannel.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (isHost && msg.type === 'input') {
        clientInput = msg.data;
      } else if (!isHost && msg.type === 'state') {
        gameState = msg.state;
      }
    };
  }

  function copySDP() {
    localSDPEl.select();
    navigator.clipboard.writeText(localSDPEl.value);
    alert("Connection code copied to clipboard!");
  }

  function launchGame() {
    statusEl.innerText = "Status: Connected! Launching arena...";
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('gameContainer').style.display = 'flex';
    initGame();
  }

  // --- Top-Down Game Engine ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let keys = {};
  let mouse = { x: 400, y: 250, down: false };
  let clientInput = { keys: {}, angle: 0, shoot: false };

  let gameState = {
    players: {
      host:   { x: 150, y: 250, angle: 0, score: 0, color: '#00ffcc', hp: 100 },
      client: { x: 650, y: 250, angle: 0, score: 0, color: '#ff0066', hp: 100 }
    },
    bullets: []
  };

  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  canvas.addEventListener('mousedown', () => mouse.down = true);
  canvas.addEventListener('mouseup', () => mouse.down = false);

  function initGame() {
    requestAnimationFrame(gameLoop);
  }

  function gameLoop() {
    let myPlayer = isHost ? gameState.players.host : gameState.players.client;
    let dx = mouse.x - myPlayer.x;
    let dy = mouse.y - myPlayer.y;
    let aimAngle = Math.atan2(dy, dx);

    if (isHost) {
      updateHost({ keys: { ...keys }, angle: aimAngle, shoot: mouse.down });

      if (dataChannel?.readyState === 'open') {
        dataChannel.send(JSON.stringify({ type: 'state', state: gameState }));
      }
    } else {
      if (dataChannel?.readyState === 'open') {
        dataChannel.send(JSON.stringify({
          type: 'input',
          data: { keys: { ...keys }, angle: aimAngle, shoot: mouse.down }
        }));
      }
    }

    render();
    requestAnimationFrame(gameLoop);
  }

  function updateHost(hostInput) {
    updatePlayerPhysics(gameState.players.host, hostInput.keys, hostInput.angle);
    if (hostInput.shoot) {
      tryShoot('host', gameState.players.host);
    }

    updatePlayerPhysics(gameState.players.client, clientInput.keys || {}, clientInput.angle || 0);
    if (clientInput.shoot) {
      tryShoot('client', gameState.players.client);
    }

    for (let i = gameState.bullets.length - 1; i >= 0; i--) {
      let b = gameState.bullets[i];
      b.x += Math.cos(b.angle) * b.speed;
      b.y += Math.sin(b.angle) * b.speed;
      b.life--;

      if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || b.life <= 0) {
        gameState.bullets.splice(i, 1);
        continue;
      }

      for (let id in gameState.players) {
        if (id !== b.owner) {
          let p = gameState.players[id];
          let dist = Math.hypot(p.x - b.x, p.y - b.y);
          if (dist < 16) {
            p.hp -= 15;
            gameState.bullets.splice(i, 1);

            if (p.hp <= 0) {
              gameState.players[b.owner].score++;
              p.hp = 100;
              p.x = id === 'host' ? 150 : 650;
              p.y = 250;
            }
            break;
          }
        }
      }
    }
  }

  function updatePlayerPhysics(p, pKeys, angle) {
    p.angle = angle;
    const speed = 3.5;
    let vx = 0, vy = 0;

    if (pKeys['KeyW'] || pKeys['ArrowUp']) vy -= speed;
    if (pKeys['KeyS'] || pKeys['ArrowDown']) vy += speed;
    if (pKeys['KeyA'] || pKeys['ArrowLeft']) vx -= speed;
    if (pKeys['KeyD'] || pKeys['ArrowRight']) vx += speed;

    p.x += vx;
    p.y += vy;

    p.x = Math.max(20, Math.min(canvas.width - 20, p.x));
    p.y = Math.max(20, Math.min(canvas.height - 20, p.y));
  }

  function tryShoot(id, p) {
    const now = Date.now();
    if (!p.lastShot || now - p.lastShot > 250) {
      p.lastShot = now;
      gameState.bullets.push({
        x: p.x + Math.cos(p.angle) * 22,
        y: p.y + Math.sin(p.angle) * 22,
        angle: p.angle,
        speed: 9,
        life: 80,
        owner: id
      });
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#151522';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    drawHUD('HOST', gameState.players.host, 30, 30);
    drawHUD('CLIENT', gameState.players.client, canvas.width - 180, 30);

    ctx.fillStyle = '#ffcc00';
    for (let b of gameState.bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let id in gameState.players) {
      let p = gameState.players[id];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, -3, 22, 6);

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.restore();
    }
  }

  function drawHUD(label, player, x, y) {
    ctx.fillStyle = '#a0a0b0';
    ctx.font = 'bold 12px system-ui';
    ctx.fillText(`${label} - Score: ${player.score}`, x, y);

    ctx.strokeStyle = '#33334d';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y + 6, 150, 12);

    ctx.fillStyle = player.color;
    ctx.fillRect(x, y + 6, 150 * (Math.max(0, player.hp) / 100), 12);
  }
</script>
</body>
</html>
